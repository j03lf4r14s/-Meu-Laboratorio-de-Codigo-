<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Meu Laboratório de Código ⚡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.min.css">
<style>
:root {
    --bg-0: #070b14;
    --bg-1: #0d1220;
    --bg-2: #141a2e;
    --surface: rgba(20, 26, 46, 0.7);
    --border: rgba(100, 140, 255, 0.15);
    --border-strong: rgba(100, 140, 255, 0.35);
    --text: #e4e7eb;
    --text-dim: #8892a6;
    --text-muted: #5a6478;
    --primary: #00d4ff;
    --primary-2: #6366f1;
    --primary-glow: rgba(0, 212, 255, 0.4);
    --accent: #a855f7;
    --success: #22c55e;
    --success-glow: rgba(34, 197, 94, 0.4);
    --danger: #ef4444;
    --danger-glow: rgba(239, 68, 68, 0.35);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
        radial-gradient(ellipse 800px 600px at 0% 0%, rgba(0, 212, 255, 0.1), transparent 50%),
        radial-gradient(ellipse 800px 600px at 100% 100%, rgba(168, 85, 247, 0.1), transparent 50%),
        radial-gradient(ellipse 600px 400px at 50% 50%, rgba(99, 102, 241, 0.05), transparent 50%),
        var(--bg-0);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}
header {
    background: rgba(13, 18, 32, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    position: relative;
    z-index: 5;
}
header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), var(--accent), transparent);
    opacity: 0.6;
}
h1 {
    font-size: 1.15rem; font-weight: 700;
    display: flex; align-items: center; gap: 10px; letter-spacing: -0.02em;
}
.logo-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 10px; font-size: 1.1rem;
    box-shadow: 0 0 20px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.2);
}
.logo-text {
    background: linear-gradient(135deg, #ffffff, #8892a6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.lang-selector {
    display: flex; gap: 6px; flex-wrap: wrap;
    background: rgba(7, 11, 20, 0.6); padding: 4px;
    border-radius: 30px; border: 1px solid var(--border);
}
.lang-btn {
    padding: 7px 16px; border: 1px solid transparent; border-radius: 20px;
    background: transparent; color: var(--text-dim); cursor: pointer;
    font-size: 0.88rem; font-weight: 500; font-family: inherit;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap;
}
.lang-btn:hover { color: var(--text); background: rgba(100, 140, 255, 0.08); }
.lang-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: #fff; border-color: rgba(0, 212, 255, 0.5);
    box-shadow: 0 0 20px var(--primary-glow), 0 0 0 1px rgba(0, 212, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.15);
}
.container { display: flex; flex: 1; overflow: hidden; gap: 12px; padding: 12px; }
.editor-pane, .output-pane {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
    background: var(--surface);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.03);
}
.pane-header {
    padding: 10px 16px; background: rgba(7, 11, 20, 0.5);
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem; font-weight: 500; color: var(--text-dim);
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; letter-spacing: 0.02em; text-transform: uppercase; flex-wrap: wrap;
}
.pane-header > span:first-child { display: flex; align-items: center; gap: 8px; }
.pane-header > span:first-child::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--primary); box-shadow: 0 0 10px var(--primary-glow);
}
.pane-actions { display: flex; gap: 6px; flex-wrap: wrap; }
#editor-container { flex: 1; height: 100%; width: 100%; min-height: 0; }
#output { flex: 1; width: 100%; border: none; background: #ffffff; min-height: 0; }
#console-output {
    flex: 1; width: 100%; padding: 18px;
    font-family: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
    font-size: 0.88rem; background: #0a0e1a; color: #d4d4d4;
    overflow-y: auto; white-space: pre-wrap; display: none;
    line-height: 1.6; min-height: 0;
}
.run-btn, .secondary-btn, .danger-btn {
    padding: 7px 14px; border-radius: var(--radius-sm); cursor: pointer;
    font-weight: 600; font-size: 0.82rem; font-family: inherit;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 0.01em; border: 1px solid transparent; white-space: nowrap;
}
.run-btn {
    background: linear-gradient(135deg, var(--success), #16a34a); color: #fff;
    box-shadow: 0 0 16px var(--success-glow), inset 0 1px 0 rgba(255,255,255,0.15);
}
.run-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 24px var(--success-glow), inset 0 1px 0 rgba(255,255,255,0.2);
}
.run-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
.secondary-btn { background: rgba(100, 140, 255, 0.08); color: var(--text); border-color: var(--border); }
.secondary-btn:hover { background: rgba(100, 140, 255, 0.15); border-color: var(--border-strong); box-shadow: 0 0 16px rgba(0, 212, 255, 0.15); }
.danger-btn { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border-color: rgba(239, 68, 68, 0.25); }
.danger-btn:hover { background: rgba(239, 68, 68, 0.2); color: #fecaca; border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 16px var(--danger-glow); }

/* Library */
#library-container { display: none; flex: 1; flex-direction: column; background: transparent; overflow: hidden; min-height: 0; }
#library-container.active { display: flex; }
.library-toolbar { padding: 12px 16px; background: rgba(7, 11, 20, 0.5); border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#library-search { flex: 1; min-width: 200px; padding: 9px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.88rem; font-family: inherit; outline: none; background: rgba(7, 11, 20, 0.6); color: var(--text); transition: all 0.2s; }
#library-search::placeholder { color: var(--text-muted); }
#library-search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15), 0 0 20px rgba(0, 212, 255, 0.1); }
#library-list { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; align-content: start; min-height: 0; }
#library-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; color: var(--text-dim); }
#library-empty > div:first-child { font-size: 4rem; filter: drop-shadow(0 0 24px var(--primary-glow)); margin-bottom: 16px; }
#library-empty h3 { margin-bottom: 8px; color: var(--text); font-size: 1.1rem; font-weight: 600; }
#library-empty p { margin-top: 4px; }
#library-empty code { background: rgba(0, 212, 255, 0.1); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
.lib-card { background: linear-gradient(135deg, rgba(20, 26, 46, 0.9), rgba(13, 18, 32, 0.9)); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; animation: fadeIn 0.3s ease; }
.lib-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), transparent 50%, rgba(168, 85, 247, 0.08)); opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.lib-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 24px rgba(0, 212, 255, 0.1); }
.lib-card:hover::before { opacity: 1; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.lib-card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lib-lang { padding: 3px 9px; border-radius: 12px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; border: 1px solid; }
.lib-lang-html { background: rgba(255, 152, 0, 0.15); color: #ffb74d; border-color: rgba(255, 152, 0, 0.3); }
.lib-lang-python { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
.lib-lang-css { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
.lib-lang-javascript { background: rgba(234, 179, 8, 0.15); color: #facc15; border-color: rgba(234, 179, 8, 0.3); }
.lib-lang-unknown { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border-color: rgba(148, 163, 184, 0.3); }
.lib-date { font-size: 0.73rem; color: var(--text-muted); font-weight: 500; }
.lib-title { font-weight: 600; font-size: 0.95rem; color: var(--text); word-break: break-word; line-height: 1.3; letter-spacing: -0.01em; }
.lib-preview { font-family: 'JetBrains Mono', 'SF Mono', Monaco, monospace; font-size: 0.72rem; color: var(--text-dim); background: rgba(7, 11, 20, 0.6); padding: 10px; border-radius: var(--radius-sm); max-height: 84px; overflow: hidden; white-space: pre-wrap; word-break: break-all; line-height: 1.5; border: 1px solid rgba(100, 140, 255, 0.08); }
.lib-actions { display: flex; gap: 6px; margin-top: auto; }
.lib-btn { padding: 6px 10px; border: 1px solid var(--border); background: rgba(100, 140, 255, 0.05); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.78rem; color: var(--text-dim); font-family: inherit; transition: all 0.15s; font-weight: 500; }
.lib-btn:hover { background: rgba(100, 140, 255, 0.15); color: var(--text); border-color: var(--border-strong); }
.lib-btn-open { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: rgba(0, 212, 255, 0.4); flex: 1; box-shadow: 0 0 12px rgba(0, 212, 255, 0.2); }
.lib-btn-open:hover { background: linear-gradient(135deg, #00b8e6, #4f46e5); color: #fff; box-shadow: 0 0 20px var(--primary-glow); }
.lib-btn-del:hover { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }

/* === QR Code === */
#qr-container { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 20px; gap: 18px; min-height: 0; }
#qr-container.active { display: flex; }
.qr-section { display: flex; flex-direction: column; gap: 8px; }
.qr-label { font-size: 0.85rem; color: var(--text-dim); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.qr-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.qr-preset { padding: 6px 12px; background: rgba(100, 140, 255, 0.08); border: 1px solid var(--border); color: var(--text); border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-family: inherit; transition: all 0.15s; font-weight: 500; }
.qr-preset:hover { background: rgba(0, 212, 255, 0.15); border-color: var(--primary); color: var(--primary); box-shadow: 0 0 16px rgba(0, 212, 255, 0.2); }
#qr-content { padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: rgba(7, 11, 20, 0.6); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; resize: vertical; min-height: 100px; outline: none; transition: all 0.2s; width: 100%; }
#qr-content:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15); }
#qr-size { width: 100%; accent-color: var(--primary); }
.qr-row-2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.qr-field { display: flex; flex-direction: column; gap: 6px; }
.qr-field input[type="color"] { width: 100%; height: 42px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: rgba(7, 11, 20, 0.6); cursor: pointer; padding: 4px; }
.qr-field select { padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: rgba(7, 11, 20, 0.6); color: var(--text); font-family: inherit; font-size: 0.88rem; cursor: pointer; outline: none; }
.qr-field select:focus { border-color: var(--primary); }
.qr-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
#qr-output { flex: 1; display: none; align-items: center; justify-content: center; padding: 24px; overflow: auto; min-height: 0; background: rgba(7, 11, 20, 0.4); }
#qr-output.active { display: flex; flex-direction: column; gap: 16px; }
#qr-canvas-wrap {
    background: #ffffff; padding: 16px; border-radius: 14px;
    box-shadow: 0 0 60px rgba(0, 212, 255, 0.35), 0 8px 32px rgba(0, 0, 0, 0.4);
    display: flex; align-items: center; justify-content: center;
    min-width: 100px; min-height: 100px;
    position: relative;
    animation: qrPulse 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes qrPulse {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
#qr-canvas-wrap canvas, #qr-canvas-wrap img { display: block; max-width: 100%; height: auto; }
#qr-canvas-wrap .qr-placeholder { color: #999; padding: 40px; font-size: 0.9rem; text-align: center; }
@media (max-width: 600px) {
    .qr-row-2 { grid-template-columns: 1fr; }
}

/* Modal */
#modal-overlay { display: none; position: fixed; inset: 0; background: rgba(7, 11, 20, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; animation: fadeIn 0.15s ease; }
.modal { background: linear-gradient(135deg, #141a2e, #0d1220); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 24px; min-width: 360px; max-width: 90vw; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(0, 212, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 16px; animation: modalIn 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
@keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal h3 { font-size: 1.1rem; color: var(--text); font-weight: 600; letter-spacing: -0.01em; }
#modal-input { padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem; font-family: inherit; outline: none; width: 100%; background: rgba(7, 11, 20, 0.6); color: var(--text); transition: all 0.2s; }
#modal-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal-actions button { padding: 9px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgba(100, 140, 255, 0.08); color: var(--text); cursor: pointer; font-size: 0.88rem; font-family: inherit; font-weight: 500; transition: all 0.15s; }
.modal-actions button:hover { background: rgba(100, 140, 255, 0.15); }
#modal-confirm { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: rgba(0, 212, 255, 0.4); box-shadow: 0 0 16px var(--primary-glow); }
#modal-confirm:hover { background: linear-gradient(135deg, #00b8e6, #4f46e5); box-shadow: 0 0 24px var(--primary-glow); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100, 140, 255, 0.2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 212, 255, 0.4); }
</style>
</head>
<body>
<header>
    <h1>
        <span class="logo-badge">🧪</span>
        <span class="logo-text">⚡ Meu Laboratório de Código ⚡</span>
    </h1>
    <div class="lang-selector">
        <button class="lang-btn active" data-lang="html">HTML</button>
        <button class="lang-btn" data-lang="python">Python</button>
        <button class="lang-btn" data-lang="qr">📱 QR Code</button>
        <button class="lang-btn" data-lang="library">💾 Salvos</button>
    </div>
</header>
<div class="container">
    <div class="editor-pane">
        <div class="pane-header">
            <span id="pane-title">Código</span>
            <div class="pane-actions">
                <button class="secondary-btn" id="format-btn" style="display:none;" title="Formatar código (Ctrl+Shift+F)">✨ Formatar</button>
                <button class="secondary-btn" id="minify-btn" style="display:none;" title="Minificar código (deixar menor)">📦 Minificar</button>
                <button class="secondary-btn" id="save-btn" style="display:none;">💾 Salvar</button>
                <button class="run-btn" id="run-btn" style="display:none;">▶ Executar</button>
                <button class="danger-btn" id="delete-btn" style="display:none;">🗑️ Apagar</button>
            </div>
        </div>
        <div id="editor-container"></div>
        
        <div id="qr-container">
            <div class="qr-section">
                <label class="qr-label">⚡ Atalhos rápidos</label>
                <div class="qr-presets">
                    <button class="qr-preset" data-preset="url">🔗 URL</button>
                    <button class="qr-preset" data-preset="email">📧 Email</button>
                    <button class="qr-preset" data-preset="phone">📱 Telefone</button>
                    <button class="qr-preset" data-preset="sms">💬 SMS</button>
                    <button class="qr-preset" data-preset="wifi">📶 WiFi</button>
                    <button class="qr-preset" data-preset="vcard">👤 vCard</button>
                    <button class="qr-preset" data-preset="geo">📍 Localização</button>
                </div>
            </div>
            
            <div class="qr-section">
                <label class="qr-label" for="qr-content">📝 Conteúdo do QR Code</label>
                <textarea id="qr-content" placeholder="Digite texto, URL, etc...">https://exemplo.com</textarea>
            </div>
            
            <div class="qr-section">
                <label class="qr-label">📐 Tamanho: <span id="qr-size-val" style="color: var(--primary); font-weight: 700;">256px</span></label>
                <input type="range" id="qr-size" min="128" max="512" value="256" step="32">
            </div>
            
            <div class="qr-section qr-row-2">
                <div class="qr-field">
                    <label class="qr-label">🎨 Cor</label>
                    <input type="color" id="qr-color" value="#000000">
                </div>
                <div class="qr-field">
                    <label class="qr-label">🖼️ Fundo</label>
                    <input type="color" id="qr-bg" value="#ffffff">
                </div>
                <div class="qr-field">
                    <label class="qr-label">🛡️ Correção</label>
                    <select id="qr-ecc">
                        <option value="L">L (7%)</option>
                        <option value="M" selected>M (15%)</option>
                        <option value="Q">Q (25%)</option>
                        <option value="H">H (30%)</option>
                    </select>
                </div>
            </div>
            
            <div class="qr-section qr-actions">
                <button class="run-btn" id="qr-download">⬇️ Baixar PNG</button>
                <button class="secondary-btn" id="qr-copy">📋 Copiar</button>
                <button class="danger-btn" id="qr-clear">🗑️ Limpar</button>
            </div>
        </div>
        
        <div id="library-container">
            <div class="library-toolbar">
                <input type="text" id="library-search" placeholder="🔍 Buscar por título ou conteúdo...">
                <button class="secondary-btn" id="library-export-btn">⬇️ Exportar</button>
                <button class="secondary-btn" id="library-import-btn">⬆️ Importar</button>
                <input type="file" id="library-import-input" accept=".json" style="display:none;">
            </div>
            <div id="library-list"></div>
            <div id="library-empty">
                <div>📭</div>
                <h3>Nenhum código salvo ainda</h3>
                <p>Use o botão <strong>💾 Salvar</strong> nas abas HTML ou Python.</p>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 12px;">Os dados ficam no <code>localStorage</code> do navegador. Use <strong>⬇️ Exportar</strong> para gerar backup.</p>
            </div>
        </div>
    </div>
    <div class="output-pane">
        <div class="pane-header"><span id="output-title">Resultado</span></div>
        <iframe id="output"></iframe>
        <div id="console-output"></div>
        <div id="qr-output">
            <div id="qr-canvas-wrap">
                <div class="qr-placeholder">QR Code aparecerá aqui</div>
            </div>
        </div>
    </div>
</div>
<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-title">Salvar código</h3>
        <input type="text" id="modal-input" placeholder="Nome...">
        <div class="modal-actions">

<script>
let editor, pyodide;
let currentLang = 'html';

const samples = {
    html: `<!DOCTYPE html>
<html><head><style>
body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: linear-gradient(135deg, #0a0e1a, #141a2e); color: #e4e7eb; }
.card { background: rgba(20, 26, 46, 0.8); padding: 2rem; border-radius: 16px; border: 1px solid rgba(0, 212, 255, 0.3); box-shadow: 0 0 40px rgba(0, 212, 255, 0.2); text-align: center; }
h2 { background: linear-gradient(135deg, #00d4ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top: 0; }
button { background: linear-gradient(135deg, #00d4ff, #6366f1); color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
</style></head><body><div class="card"><h2>Olá, Mundo!</h2><p>Preview em tempo real.</p><button onclick="alert('Funciona!')">Clique</button></div></body></html>`,
    python: `import sys\ndef greet(name):\n    return f"Olá, {name}!"\nprint(greet("Desenvolvedor"))\nprint(f"Python: {sys.version}")`
};
const savedContent = { html: samples.html, python: samples.python };

function uuid() { return crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,10); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(ts) {
    const d = Date.now() - ts;
    if (d < 60000) return 'agora';
    if (d < 3600000) return Math.floor(d/60000)+'min atrás';
    if (d < 86400000) return Math.floor(d/3600000)+'h atrás';
    return new Date(ts).toLocaleDateString('pt-BR')+' '+new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

const STORAGE_KEY = 'lab_code_saved_v1';
let savedItems = (() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){ return []; } })();
function persistSaved(items) {
    try {
        const json = JSON.stringify(items);
        if (json.length > 4*1024*1024 && !confirm(`⚠️ Seus códigos ocupam ${(json.length/1024/1024).toFixed(1)}MB. Continuar?`)) return false;
        localStorage.setItem(STORAGE_KEY, json); return true;
    } catch(e) { alert('Erro ao salvar: '+e.message); return false; }
}
function updateSavedBadge() {
    const btn = document.querySelector('.lang-btn[data-lang="library"]');
    if (btn) btn.textContent = savedItems.length ? `💾 Salvos (${savedItems.length})` : '💾 Salvos';
}

let modalResolve = null;
function showModal(title, def='', placeholder='') {
    return new Promise(resolve => {
        modalResolve = resolve;
        document.getElementById('modal-title').textContent = title;
        const inp = document.getElementById('modal-input');
        inp.value = def; inp.placeholder = placeholder;
        document.getElementById('modal-overlay').style.display = 'flex';
        setTimeout(() => { inp.focus(); inp.select(); }, 50);
    });
}
document.getElementById('modal-cancel').onclick = () => { document.getElementById('modal-overlay').style.display = 'none'; if (modalResolve) modalResolve(null); modalResolve = null; };
document.getElementById('modal-confirm').onclick = () => { const v = document.getElementById('modal-input').value.trim(); document.getElementById('modal-overlay').style.display = 'none'; if (modalResolve) modalResolve(v); modalResolve = null; };
document.getElementById('modal-input').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('modal-confirm').click(); if (e.key === 'Escape') document.getElementById('modal-cancel').click(); };

async function saveCurrentCode(lang, code) {
    if (!code || !code.trim()) { alert('Nada para salvar.'); return; }
    const def = `Meu ${lang} - ${new Date().toLocaleDateString('pt-BR')}`;
    const title = await showModal('💾 Salvar código', def, 'Nome do código...');
    if (title === null) return;
    savedItems.push({ id: uuid(), title: title || 'Sem título', lang, code, createdAt: Date.now(), updatedAt: Date.now() });
    if (persistSaved(savedItems)) { updateSavedBadge(); renderLibrary(document.getElementById('library-search').value); }
}
document.getElementById('save-btn').onclick = () => {
    if (currentLang === 'html' || currentLang === 'python') saveCurrentCode(currentLang, editor.getValue());
};

document.getElementById('delete-btn').onclick = () => {
    if (currentLang !== 'html' && currentLang !== 'python') return;
    if (!editor.getValue().trim()) { alert('O editor já está vazio.'); return; }
    if (!confirm('🗑️ Apagar todo o código do editor?\n\nEsta ação não pode ser desfeita.')) return;
    editor.setValue('');
    savedContent[currentLang] = '';
    if (currentLang === 'html') updateHtmlPreview();
};

document.getElementById('run-btn').onclick = async () => {
    if (currentLang === 'html') {
        updateHtmlPreview();
        const btn = document.getElementById('run-btn');
        const orig = btn.textContent;
        btn.textContent = '✓ Atualizado'; btn.disabled = true;
        setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 900);
        return;
    }
    if (currentLang !== 'python') return;
    const btn = document.getElementById('run-btn');
    const con = document.getElementById('console-output');
    btn.disabled = true; btn.textContent = 'Carregando...';
    con.textContent = '// Inicializando ambiente Python (pode levar alguns segundos na primeira vez)...';
    try {
        await ensurePyodide(con);
        con.textContent = '// Executando...\n\n';
        await pyodide.runPythonAsync(editor.getValue());
        if (con.textContent === '// Executando...\n\n') con.textContent += '// (Nenhuma saída no console)';
    } catch(e) { con.textContent += '\nERRO NA EXECUÇÃO:\n' + e; }
    finally { btn.disabled = false; btn.textContent = '▶ Executar'; }
};
async function ensurePyodide(con) {
    if (pyodide) return;
    pyodide = await loadPyodide({
        stdout: (t) => { con.textContent += t + '\n'; },
        stderr: (t) => { con.textContent += 'ERRO: ' + t + '\n'; }
    });
    con.textContent = '';
}

function applyEditorChange(newText) {
    const model = editor.getModel();
    const fullRange = model.getFullModelRange();
    editor.pushUndoStop();
    editor.executeEdits('format', [{ range: fullRange, text: newText, forceMoveMarkers: true }]);
    editor.pushUndoStop();
    savedContent[currentLang] = editor.getValue();
    if (currentLang === 'html') updateHtmlPreview();
}
function flashBtn(id, label) {
    const b = document.getElementById(id);
    const orig = b.dataset.orig || b.textContent;
    b.dataset.orig = orig;
    b.textContent = label;
    b.disabled = true;
    setTimeout(() => { b.textContent = orig; b.disabled = false; }, 900);
}
function formatHtmlCode(code) {
    return html_beautify(code, { indent_size: 2, indent_char: ' ', wrap_line_length: 0, preserve_newlines: true, max_preserve_newlines: 2, indent_inner_html: true, end_with_newline: true, extra_liners: [] });
}
function formatPythonCode(code) {
    const rawLines = code.split('\n').map(l => l.replace(/[ \t]+$/, ''));
    const out = []; let blanks = 0;
    for (const line of rawLines) {
        if (!line.trim()) { blanks++; if (blanks <= 2) out.push(''); continue; }
        blanks = 0;
        const leading = line.match(/^[ \t]*/)[0];
        const spaces = leading.replace(/\t/g, '    ').length;
        const levels = Math.round(spaces / 4);
        out.push('    '.repeat(levels) + line.trimStart());
    }
    while (out.length && !out[0].trim()) out.shift();
    while (out.length && out[out.length-1].trim() === '') out.pop();
    return out.join('\n') + '\n';
}
document.getElementById('format-btn').onclick = () => {
    try {
        const code = editor.getValue();
        if (!code.trim()) { alert('Nada para formatar.'); return; }
        let formatted;
        if (currentLang === 'html') formatted = formatHtmlCode(code);
        else if (currentLang === 'python') formatted = formatPythonCode(code);
        else return;
        if (formatted === code) { flashBtn('format-btn', '✓ Já formatado'); return; }
        applyEditorChange(formatted);
        flashBtn('format-btn', '✓ Formatado');
    } catch(e) { alert('Erro ao formatar: ' + e.message); }
};

function minifyHtmlCode(code) {
    const placeholders = [];
    let p = code.replace(/<(pre|textarea|script|style)\b[^>]*>[\s\S]*?<\/\1>/gi, (match) => {
        placeholders.push(match); return `__PROTECTED_${placeholders.length - 1}__`;
    });
    p = p.replace(/<!--(?!\[if)[\s\S]*?-->/g, '');
    p = p.replace(/>\s+</g, '><');
    p = p.replace(/[ \t]+/g, ' ');
    p = p.replace(/\s*\n\s*/g, ' ').trim();
    return p.replace(/__PROTECTED_(\d+)__/g, (_, i) => placeholders[parseInt(i)]);
}
function minifyPythonCode(code) {
    const lines = code.split('\n'); const out = [];
    let inTriple = false, tripleChar = '';
    for (const line of lines) {
        const trimmed = line.trim();
        const m = trimmed.match(/"""|'''/g);
        if (m) {
            if (m.length === 1) {
                if (!inTriple) { inTriple = true; tripleChar = m[0]; }
                else if (m[0] === tripleChar) inTriple = false;
            }
        }
        if (!inTriple) {
            if (!trimmed) continue;
            if (trimmed.startsWith('#') && !trimmed.includes('coding')) continue;
        }
        out.push(line.replace(/[ \t]+$/, ''));
    }
    return out.join('\n') + '\n';
}
document.getElementById('minify-btn').onclick = () => {
    try {
        const code = editor.getValue();
        if (!code.trim()) { alert('Nada para minificar.'); return; }
        let minified;
        if (currentLang === 'html') minified = minifyHtmlCode(code);
        else if (currentLang === 'python') minified = minifyPythonCode(code);
        else return;
        const before = code.length, after = minified.length;
        const pct = before > 0 ? Math.round((1 - after / before) * 100) : 0;
        if (after === before) { flashBtn('minify-btn', '✓ Já compacto'); return; }
        applyEditorChange(minified);
        flashBtn('minify-btn', `✓ -${pct}%`);
    } catch(e) { alert('Erro ao minificar: ' + e.message); }
};

document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        if (currentLang === 'html' || currentLang === 'python') document.getElementById('format-btn').click();
    }
});

    phone: 'tel:+5511999999999',
    sms: 'sms:+5511999999999?body=Olá, tudo bem?',

N:Silva;João
FN:João Silva
ORG:Empresa LTDA
TEL:+5511999999999
EMAIL:joao@exemplo.com
URL:https://exemplo.com
END:VCARD`,
    geo: 'geo:-23.5505,-46.6333'
};

function generateQR() {
    const wrap = document.getElementById('qr-canvas-wrap');
    wrap.innerHTML = '';
    
    const content = document.getElementById('qr-content').value;
    if (!content || !content.trim()) {
        wrap.innerHTML = '<div class="qr-placeholder">📝 Digite algum conteúdo ao lado</div>';
        return;
    }
    
    if (typeof QRCode === 'undefined') {
        wrap.innerHTML = '<div class="qr-placeholder" style="color:#ef4444;">❌ Biblioteca QR não carregou. Verifique sua conexão.</div>';
        return;
    }
    
    const size = parseInt(document.getElementById('qr-size').value);
    const color = document.getElementById('qr-color').value;
    const bg = document.getElementById('qr-bg').value;
    const ecc = document.getElementById('qr-ecc').value;
    
    try {
        new QRCode(wrap, {
            text: content,
            width: size,
            height: size,
            colorDark: color,
            colorLight: bg,
            correctLevel: QRCode.CorrectLevel[ecc]
        });
    } catch(e) {
        wrap.innerHTML = '<div class="qr-placeholder" style="color:#ef4444;">❌ ' + escapeHtml(e.message) + '</div>';
    }
}

function downloadQR() {
    const canvas = document.querySelector('#qr-canvas-wrap canvas');
    const img = document.querySelector('#qr-canvas-wrap img');
    if (!canvas && (!img || !img.src)) { alert('Gere um QR code primeiro.'); return; }
    
    if (canvas && canvas.toBlob) {
        canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `qrcode-${Date.now()}.png`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            flashBtn('qr-download', '✓ Baixado');
        }, 'image/png');
    } else if (img && img.src) {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = `qrcode-${Date.now()}.png`;
        a.click();
        flashBtn('qr-download', '✓ Baixado');
    }
}

async function copyQR() {
    const canvas = document.querySelector('#qr-canvas-wrap canvas');
    if (!canvas) { alert('Gere um QR code primeiro.'); return; }
    try {
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        flashBtn('qr-copy', '✓ Copiado');
    } catch(e) {
        if (confirm('Não foi possível copiar automaticamente (o navegador exige HTTPS ou localhost).\n\nDeseja baixar a imagem como PNG em vez disso?')) {
            downloadQR();
        }
    }
}

// Debounce para input de texto
let qrTimer;
function debounceQR() {
    clearTimeout(qrTimer);
    qrTimer = setTimeout(generateQR, 250);
}

document.getElementById('qr-content').addEventListener('input', debounceQR);
document.getElementById('qr-size').addEventListener('input', (e) => {
    document.getElementById('qr-size-val').textContent = e.target.value + 'px';
    debounceQR();
});
document.getElementById('qr-color').addEventListener('input', debounceQR);
document.getElementById('qr-bg').addEventListener('input', debounceQR);
document.getElementById('qr-ecc').addEventListener('change', generateQR);

document.querySelectorAll('.qr-preset').forEach(btn => {
    btn.addEventListener('click', () => {
        const key = btn.dataset.preset;
        if (qrPresets[key]) {
            document.getElementById('qr-content').value = qrPresets[key];
            generateQR();
        }
    });
});

document.getElementById('qr-download').onclick = downloadQR;
document.getElementById('qr-copy').onclick = copyQR;
document.getElementById('qr-clear').onclick = () => {
    if (!document.getElementById('qr-content').value.trim()) return;
    if (!confirm('🗑️ Limpar o conteúdo do QR Code?')) return;
    document.getElementById('qr-content').value = '';
    generateQR();
};

// === Library ===
function renderLibrary(filter='') {
    const container = document.getElementById('library-list');
    const empty = document.getElementById('library-empty');
    const f = filter.trim().toLowerCase();
    const filtered = savedItems.filter(i => !f || i.title.toLowerCase().includes(f) || (i.code||'').toLowerCase().includes(f))
        .sort((a,b) => b.updatedAt - a.updatedAt);
    if (filtered.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'flex';
        empty.querySelector('h3').textContent = f ? `Nenhum resultado para "${filter}"` : 'Nenhum código salvo ainda';
        return;
    }
    empty.style.display = 'none';
    container.innerHTML = filtered.map(item => `
        <div class="lib-card" data-id="${item.id}">
            <div class="lib-card-header">
                <span class="lib-lang lib-lang-${escapeHtml(item.lang||'unknown')}">${escapeHtml(item.lang||'?')}</span>
                <span class="lib-date">${formatDate(item.updatedAt)}</span>
            </div>
            <div class="lib-title">${escapeHtml(item.title)}</div>
            <div class="lib-preview">${escapeHtml((item.code||'').substring(0,200))}</div>
            <div class="lib-actions">
                <button class="lib-btn lib-btn-open" data-act="open">📂 Abrir</button>
                <button class="lib-btn" data-act="rename" title="Renomear">✏️</button>
                <button class="lib-btn" data-act="dup" title="Duplicar">📋</button>
                <button class="lib-btn lib-btn-del" data-act="del" title="Excluir">🗑️</button>
            </div>
        </div>
    `).join('');
    container.querySelectorAll('.lib-card').forEach(card => {
        const id = card.dataset.id;
        card.querySelectorAll('[data-act]').forEach(b => {
            b.onclick = () => {
                if (b.dataset.act === 'open') openSaved(id);
                else if (b.dataset.act === 'rename') renameSaved(id);
                else if (b.dataset.act === 'dup') duplicateSaved(id);
                else if (b.dataset.act === 'del') deleteSaved(id);
            };
        });
    });
}
function openSaved(id) {
    const item = savedItems.find(i => i.id === id);
    if (!item) return;
    if (item.lang === 'html' || item.lang === 'python') {
        savedContent[item.lang] = item.code;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.lang-btn[data-lang="${item.lang}"]`).classList.add('active');
        switchMode(item.lang);
        if (item.lang === 'html') updateHtmlPreview();
    } else {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(item.code).then(() => {
                alert(`📋 Código "${item.title}" copiado para a área de transferência!`);
            }).catch(() => { alert(`Código "${item.title}" (${item.lang}):\n\n${item.code.substring(0, 1500)}`); });
        } else { alert(`Código "${item.title}" (${item.lang}):\n\n${item.code.substring(0, 1500)}`); }
    }
}
async function renameSaved(id) {
    const item = savedItems.find(i => i.id === id);
    if (!item) return;
    const n = await showModal('✏️ Renomear', item.title, 'Novo nome...');
    if (!n) return;
    item.title = n; item.updatedAt = Date.now();
    if (persistSaved(savedItems)) renderLibrary(document.getElementById('library-search').value);
}
function duplicateSaved(id) {
    const item = savedItems.find(i => i.id === id);
    if (!item) return;
    savedItems.push({ ...item, id: uuid(), title: item.title + ' (cópia)', createdAt: Date.now(), updatedAt: Date.now() });
    if (persistSaved(savedItems)) { updateSavedBadge(); renderLibrary(document.getElementById('library-search').value); }
}
function deleteSaved(id) {
    const item = savedItems.find(i => i.id === id);
    if (!item || !confirm(`Excluir "${item.title}"?`)) return;
    savedItems = savedItems.filter(i => i.id !== id);
    if (persistSaved(savedItems)) { updateSavedBadge(); renderLibrary(document.getElementById('library-search').value); }
}
document.getElementById('library-search').addEventListener('input', (e) => renderLibrary(e.target.value));
document.getElementById('library-export-btn').onclick = () => {
    if (!savedItems.length) { alert('Nada para exportar.'); return; }
    const blob = new Blob([JSON.stringify(savedItems, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `meu-laboratorio-codigos-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
};
document.getElementById('library-import-btn').onclick = () => document.getElementById('library-import-input').click();
document.getElementById('library-import-input').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data)) throw new Error('Formato inválido.');
        let n = 0;
        for (const x of data) {
            if (!x || !x.code) continue;
            savedItems.push({
                id: savedItems.find(i => i.id === x.id) ? uuid() : (x.id || uuid()),
                title: x.title || 'Sem título', lang: x.lang || 'html', code: x.code,
                createdAt: x.createdAt || Date.now(), updatedAt: x.updatedAt || Date.now()
            });
            n++;
        }
        if (persistSaved(savedItems)) { updateSavedBadge(); renderLibrary(); alert(`✅ ${n} código(s) importado(s).`); }
    } catch(err) { alert('Erro: '+err.message); }
    e.target.value = '';
};

document.querySelectorAll('.lang-btn').forEach(btn => {

        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

function switchMode(lang) {
    if ((currentLang === 'html' || currentLang === 'python') && editor && editor.getModel()) savedContent[currentLang] = editor.getValue();
    const prev = currentLang; currentLang = lang;
    const edEl = document.getElementById('editor-container');
    const libEl = document.getElementById('library-container');
    const qrEl = document.getElementById('qr-container');
    const iframe = document.getElementById('output');
    const con = document.getElementById('console-output');
    const qrOut = document.getElementById('qr-output');
    const saveBtn = document.getElementById('save-btn');
    const runBtn = document.getElementById('run-btn');
    const delBtn = document.getElementById('delete-btn');
    const fmtBtn = document.getElementById('format-btn');
    const minBtn = document.getElementById('minify-btn');
    const title = document.getElementById('pane-title');
    const outputTitle = document.getElementById('output-title');

    // Esconde todos os containers do painel esquerdo
    edEl.style.display = 'none';
    libEl.classList.remove('active');
    qrEl.classList.remove('active');

    // Esconde todos os containers do painel direito
    iframe.style.display = 'none';
    con.style.display = 'none';
    qrOut.classList.remove('active');

    // Esconde todos os botões de ação do editor
    [saveBtn, runBtn, delBtn, fmtBtn, minBtn].forEach(b => b.style.display = 'none');

    if (lang === 'library') {
        libEl.classList.add('active');
        title.textContent = 'Códigos Salvos';
        outputTitle.textContent = 'Resultado';
        iframe.style.display = 'block';
        renderLibrary(document.getElementById('library-search').value);
        return;
    }

    if (lang === 'qr') {
        qrEl.classList.add('active');
        title.textContent = '📱 Gerador de QR Code';
        outputTitle.textContent = '📱 QR Code';
        qrOut.classList.add('active');
        generateQR();
        return;
    }

    // HTML ou Python
    edEl.style.display = 'block';
    [saveBtn, runBtn, delBtn, fmtBtn, minBtn].forEach(b => b.style.display = 'inline-block');
    title.textContent = 'Código';
    outputTitle.textContent = 'Resultado';

    if (editor && editor.getModel()) {
        monaco.editor.setModelLanguage(editor.getModel(), lang === 'html' ? 'html' : 'python');
        editor.setValue(savedContent[lang] || '');
    }
    if (lang === 'html') {
        iframe.style.display = 'block';
        updateHtmlPreview();
    } else {
        con.style.display = 'block';
        if (prev !== 'python') con.textContent = '// O resultado aparecerá aqui.\n// Clique em ▶ Executar.';
    }
}

function updateHtmlPreview() { document.getElementById('output').srcdoc = editor.getValue(); }

updateSavedBadge();
</script>
</body>
</html>
